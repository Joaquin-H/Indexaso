<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preguntero Economía - Parcial 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root{
      --bg:#0f131a;
      --surface:#161b22;
      --surface-2:#1d2430;
      --text:#e6edf3;
      --muted:#9aa7b7;
      --border:#2d3746;
      --accent:#6f8cff;
      --accent-soft:#25314f;
      --success:#2d8a57;
      --error:#b6464f;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.22);
      --shadow-md:0 10px 28px rgba(0,0,0,0.3);
      --radius-sm:10px;
      --radius-md:14px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:"Inter","Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      line-height:1.45;
    }

    .container-quiz{max-width:1400px;margin:0 auto;padding:16px;width:100%;height:100vh;display:flex;flex-direction:column}
    .card-quiz{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-md)}
    .main-layout{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .quiz-main-content{overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
    .quiz-main-content::-webkit-scrollbar{display:none}
    @media (min-width:768px){
      .main-layout{display:grid!important;grid-template-columns:300px 1fr;gap:20px}
      .main-layout .quiz-sidebar,.main-layout .quiz-main-content{overflow:hidden}
      .main-layout .quiz-main-content{overflow-y:auto}
      .controls{display:none!important}
    }

    .quiz-sidebar{display:flex;flex-direction:column;gap:14px;height:100%;overflow:hidden}
    .sidebar-content{display:flex;flex-direction:column;flex:1;overflow:hidden}
    .sidebar-bottom{margin-top:auto;padding-top:12px;flex-shrink:0}
    .status-line,.q-meta,.index-page-info,.stat-label{color:var(--muted)}
    .status-line{font-size:.9rem}
    .q-meta,.index-page-info{font-size:.75rem}
    .question-title{font-weight:700;font-size:1rem}

    .quiz-type-selector{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px}
    .quiz-type-selector.hidden{display:none}
    .quiz-type-selector h6{margin:0 0 4px;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
    .quiz-type-selector.center{max-width:420px;padding:22px;margin:auto}
    .quiz-type-selector.center .quiz-type-btn .label{max-width:100%;white-space:normal}
    .main-layout.center-mode{display:flex!important;align-items:center;justify-content:center}
    .quiz-type-btn{padding:11px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
    .quiz-type-btn .emoji{font-size:1rem;flex:0 0 auto}
    .quiz-type-btn .label{display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 36px)}
    .quiz-type-btn:hover{border-color:#46546b;background:#1b2230;color:#c6d2df}
    .quiz-type-btn.selected{background:var(--accent-soft);border-color:#6f8cff;color:#d5dfff}

    #indexList,#indexListOverlay{display:grid;gap:5px;padding:8px;min-height:0;scrollbar-width:none;-ms-overflow-style:none}
    #indexList{grid-template-columns:repeat(auto-fill,minmax(34px,1fr));grid-auto-rows:34px;flex:1;overflow-y:auto;overflow-x:hidden;align-items:start;justify-items:center}
    #indexListOverlay{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));grid-auto-rows:40px;flex:1;overflow-y:auto}
    #indexList::-webkit-scrollbar,#indexListOverlay::-webkit-scrollbar{display:none}
    .q-index-btn{width:100%;height:100%;padding:0;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.72rem;display:flex;align-items:center;justify-content:center;transition:.2s}
    .q-index-btn:hover{border-color:#6f8cff;color:#ccd6e0}
    .q-index-btn.active{background:var(--accent-soft);border-color:#6f8cff;color:#d5dfff}
    .q-index-btn.correct{background:var(--success);border-color:var(--success);color:#ffffff}
    .q-index-btn.incorrect{background:var(--error);border-color:var(--error);color:#ffffff}

    .index-navigation{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
    .index-pagination{display:flex;gap:4px}
    .page-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:.74rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
    .page-btn:hover{background:#1b2230}
    .page-btn.active{background:var(--accent-soft);border-color:#6f8cff;color:#d5dfff}

    .option{display:flex;align-items:center;gap:12px;padding:13px;border-radius:12px;border:1px solid var(--border);cursor:pointer;background:var(--surface);transition:border-color .2s,background-color .2s}
    .option input{margin:0}
    .option:hover{border-color:#4b5a72;background:#1b2230}
    .option .label-text{font-weight:500;font-size:.88rem}
    .option.correct{border-color:var(--success)!important;background:var(--success)!important;color:#ffffff}
    .option.incorrect{border-color:var(--error)!important;background:var(--error)!important;color:#ffffff}

    .text-input-container{margin-top:16px}
    .text-answer-input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1rem;font-family:inherit;transition:.2s}
    .text-answer-input::placeholder{color:#7f8da1}
    .text-answer-input:focus{outline:none;border-color:#6f8cff;box-shadow:0 0 0 3px #25314f}
    .text-answer-input.correct-input{border-color:var(--success);background:var(--success);color:#ffffff}
    .text-answer-input.incorrect-input{border-color:var(--error);background:var(--error);color:#ffffff}

    .correct-answer-feedback{margin-top:12px;padding:11px 12px;border-radius:10px;border:1px solid var(--success);background:var(--success);color:#ffffff;font-size:.88rem}
    .image-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
    .image-option{position:relative;cursor:pointer;border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s,background-color .2s;background:var(--surface)}
    .image-option:hover{border-color:#6f8cff}
    .image-option input[type=radio]{position:absolute;top:10px;right:10px;width:22px;height:22px;cursor:pointer;z-index:10}
    .image-option img{width:100%;height:auto;display:block;min-height:120px;max-height:200px;object-fit:cover}
    .image-option.selected{border-color:#6f8cff;background:#25314f}
    .image-option.correct{border-color:var(--success);background:var(--success)}
    .image-option.incorrect{border-color:var(--error);background:var(--error)}
    .question-image{width:100%;height:auto;max-width:420px;max-height:260px;object-fit:contain;border:1px solid var(--border);border-radius:12px;margin:14px auto;background:var(--surface);display:block}
    .question-image-large{max-width:640px;max-height:420px}

    .btn-primary{background:#6f8cff;border-color:#6f8cff;color:#eef3ff}
    .btn-primary:hover,.btn-primary:focus{background:#5e79e8;border-color:#5e79e8}
    .btn-outline-light{color:#c3cfdd;border-color:#3a4659;background:var(--surface)}
    .btn-outline-light:hover{background:#1b2230;color:#e6edf3;border-color:#6f8cff}

    .sidebar-type-row,.sidebar-nav-buttons{display:none;gap:6px}
    .sidebar-type-row{margin-bottom:8px}
    .sidebar-nav-buttons{margin-top:8px}
    .sidebar-type-row .btn,.sidebar-nav-buttons .btn{flex:1;min-width:0}
    .sidebar-type-row .btn{font-size:1rem;padding:8px}
    .sidebar-nav-buttons .btn{font-size:1.1rem;padding:9px}
    @media (min-width:768px){.sidebar-nav-buttons,.sidebar-type-row{display:flex}}

    .mobile-index-toggle,.mobile-summary-toggle{position:fixed;right:10px;z-index:1100;display:none;padding:8px 12px;border-radius:18px;font-size:.8rem;background:var(--surface);border:1px solid var(--border);color:#c3cfdd;box-shadow:var(--shadow-sm);cursor:pointer;white-space:nowrap;max-width:calc(100vw - 20px)}
    .mobile-index-toggle{bottom:75px}
    .mobile-summary-toggle{bottom:15px}
    .index-overlay{position:fixed;inset:0;background:#06090e;display:none;z-index:1200;padding:18px}
    .index-overlay.open{display:block}
    .index-panel{max-width:720px;margin:40px auto;background:var(--surface);border:1px solid var(--border);padding:14px;border-radius:16px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-md)}

    .summary-modal{position:fixed;inset:0;background:#06090e;display:none;z-index:2000;align-items:center;justify-content:center;padding:16px}
    .summary-modal.show{display:flex}
    .summary-content{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 18px;max-width:430px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);animation:slideIn .2s ease-out;scrollbar-width:none;-ms-overflow-style:none}
    .summary-content::-webkit-scrollbar{display:none}
    .summary-title{font-size:1.14rem;font-weight:700;text-align:center;margin-bottom:14px;color:#d9e2ec}
    .summary-score{font-size:2rem;font-weight:700;text-align:center;margin:14px 0}
    .summary-score.excellent{color:var(--success)}
    .summary-score.good{color:#9fb3c8}
    .summary-score.fair{color:#e0b35f}
    .summary-score.poor{color:var(--error)}
    .summary-stats{display:grid;gap:8px;margin:14px 0}
    .stat-row{display:flex;justify-content:space-between;padding:10px;background:var(--surface-2);border-radius:10px;border:1px solid var(--border)}
    .stat-value{font-weight:700;font-size:.95rem;color:#d9e2ec}
    .stat-value.green{color:#2f855a}
    .stat-value.red{color:#c2414b}
    .stat-value.gray{color:#64748b}
    .summary-actions{display:grid;gap:8px;margin-top:14px}
    .summary-actions .btn{width:100%;padding:10px;font-size:.9rem}
    @keyframes slideIn{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}

    .controls .btn{min-width:70px;font-size:1.05rem;padding:9px 12px}

    @media (max-width:767px){
      #qArea{margin-bottom:10px}
      .container-quiz{height:100vh;padding:10px}
      .card-quiz{height:calc(100vh - 20px);padding:12px;border-radius:14px}
      .main-layout{height:100%}
      .quiz-main-content{height:100%;display:flex;flex-direction:column}
      .quiz-sidebar{display:none!important}
      .main-layout.center-mode .quiz-sidebar{display:flex!important}
      .quiz-type-selector.center{max-width:90%;padding:20px}
      .quiz-type-btn .label{white-space:normal;max-width:100%}
      .controls{display:flex!important;flex-direction:column;gap:8px;align-items:stretch!important;margin-top:14px!important;padding-top:4px}
      .controls>div:first-child{display:flex;flex-direction:row;gap:8px;flex-wrap:wrap;width:100%}
      .controls>div:first-child .btn{flex:1 1 0;min-width:0;margin:0}
      .controls .btn,#prevBtn,#checkBtn,#nextBtn{width:100%!important;white-space:normal!important;overflow:visible!important}
      .controls .q-meta{text-align:center;order:-1;margin-bottom:6px}
      .mobile-index-toggle,.mobile-summary-toggle{display:inline-flex!important}
      .sidebar-content,.keyboard-hint{display:none!important}
      #indexList{grid-template-columns:repeat(auto-fill,minmax(30px,1fr));grid-auto-rows:30px;gap:3px}
      #indexListOverlay{max-height:calc(100vh - 140px);overflow-y:auto}
      .index-panel{margin:10px auto;max-height:calc(100vh - 60px);padding:10px}
      .index-navigation{padding:6px 0;margin-bottom:6px}
      .page-btn{width:26px;height:26px;font-size:.65rem}
      .image-options{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
      .image-option img{max-height:150px}
      .question-image{max-height:220px;max-width:100%}
      .summary-content{max-width:90%;padding:16px}
      .summary-score{font-size:1.72rem}
      .stat-row{padding:8px}
      .stat-label,.stat-value{font-size:.85rem}
    }

    @media (max-width:480px){
      .container-quiz{padding:8px}
      .card-quiz{padding:10px}
      .controls .btn{font-size:.9rem;padding:8px 10px}
      #indexList{grid-template-columns:repeat(auto-fill,minmax(28px,1fr));grid-auto-rows:28px;gap:2px}
      .q-index-btn{font-size:.65rem}
      .question-image{max-height:170px}
    }
</style>
</head>
<body>
  <div class="container-quiz px-3">
    <div class="card-quiz">
      <div class="main-layout">
        <div class="quiz-sidebar">
          <div class="quiz-type-selector" id="quizTypeSelector">
            <h6>Seleccione la materia</h6>
            <button class="quiz-type-btn" id="btnEconomia" data-type="economia">
              <span class="emoji"><i class="bi bi-graph-up"></i></span>
              <span class="label">Economía</span>
            </button>
          </div>
          <div class="sidebar-content" id="sidebarContent" style="display:none">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h6 class="mb-0" id="quizTitleHeader">Índice</h6>
              </div>
              <div class="q-meta" id="progressText">0 / 0</div>
            </div>
            
            <!-- Navegación por páginas para el índice -->
            <div class="index-navigation" id="indexNavigation" style="display: none;">
              <div class="index-page-info" id="pageInfo">Página 1 de 1</div>
              <div class="index-pagination" id="indexPagination"></div>
            </div>
            
            <div id="indexList"></div>
            <div class="sidebar-bottom">
              <hr style="border-color:var(--border);margin:12px 0">
              <div class="status-line mb-2">Puntaje: <strong id="score">0</strong> / <span id="total"></span></div>
              <div class="sidebar-type-row">
                <button class="btn btn-sm btn-outline-light" id="showSummaryBtn" title="Ver Resumen"><i class="bi bi-bar-chart"></i></button>
              </div>
              <div class="sidebar-nav-buttons">
                <button id="prevBtnSidebar" class="btn btn-outline-light" title="Anterior"><i class="bi bi-arrow-left"></i></button>
                <button id="checkBtnSidebar" class="btn btn-primary" title="Comprobar"><i class="bi bi-check-lg"></i></button>
                <button id="nextBtnSidebar" class="btn btn-outline-light" title="Siguiente"><i class="bi bi-arrow-right"></i></button>
              </div>
            </div>
          </div>
        </div>

        <div class="quiz-main-content" id="quizContent" style="display:none">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <div class="d-flex align-items-center gap-2">
                <div class="question-title" id="qTitle">Título de la pregunta</div>
              </div>
              <div class="q-meta" id="qType">Tipo</div>
            </div>
            <div class="text-end">
              <div class="q-meta">Estado</div>
              <div id="qState" class="q-meta">Sin responder</div>
            </div>
          </div>

          <div id="qArea"></div>

          <div class="d-flex justify-content-between align-items-center mt-3 controls">
            <div>
              <button id="prevBtn" class="btn btn-outline-light" title="Anterior"><i class="bi bi-arrow-left"></i></button>
              <button id="checkBtn" class="btn btn-primary" title="Comprobar"><i class="bi bi-check-lg"></i></button>
              <button id="nextBtn" class="btn btn-outline-light" title="Siguiente"><i class="bi bi-arrow-right"></i></button>
            </div>
            <div class="q-meta keyboard-hint">Enter → Comprobar</div>
          </div>
        </div>
      </div>
      <button class="btn btn-sm btn-outline-light mobile-index-toggle" id="openIndexBtn" aria-controls="indexList" aria-expanded="false"><i class="bi bi-list"></i> Índice</button>
      <button class="btn btn-sm btn-outline-light mobile-summary-toggle" id="mobileSummaryBtn"><i class="bi bi-bar-chart"></i> Resumen</button>
    </div>
  </div>

  <!-- Overlay móvil para índice -->
  <div class="index-overlay" id="indexOverlay" aria-hidden="true">
    <div class="index-panel" role="dialog" aria-modal="true" aria-label="Índice de preguntas">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong>Índice</strong>
        <div>
          <button class="btn btn-sm btn-outline-light me-2" id="closeIndexBtn">Cerrar</button>
        </div>
      </div>
      
      <!-- Navegación por páginas para el overlay móvil -->
      <div class="index-navigation" id="indexNavigationOverlay" style="display: none;">
        <div class="index-page-info" id="pageInfoOverlay">Página 1 de 1</div>
        <div class="index-pagination" id="indexPaginationOverlay"></div>
      </div>
      
      <div id="indexListOverlay"></div>
    </div>
  </div>

  <!-- Modal de resumen final -->
  <div class="summary-modal" id="summaryModal">
    <div class="summary-content">
      <div class="summary-title"><i class="bi bi-trophy"></i> Quiz de Economía Completado</div>
      <div class="summary-score" id="summaryScore">0%</div>
      <div class="summary-stats">
        <div class="stat-row">
          <span class="stat-label"><i class="bi bi-check-circle"></i> Correctas</span>
          <span class="stat-value green" id="statCorrect">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label"><i class="bi bi-x-circle"></i> Incorrectas</span>
          <span class="stat-value red" id="statIncorrect">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label"><i class="bi bi-dash-circle"></i> Sin responder</span>
          <span class="stat-value gray" id="statUnanswered">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label"><i class="bi bi-clipboard-data"></i> Total de preguntas</span>
          <span class="stat-value" id="statTotal">0</span>
        </div>
      </div>
      <div class="summary-actions">
        <button class="btn btn-primary" id="restartQuiz"><i class="bi bi-arrow-clockwise"></i> Reiniciar Quiz</button>
        <button class="btn btn-outline-light" id="reviewIncorrect"><i class="bi bi-journal-text"></i> Repasar Incorrectas</button>
        <button class="btn btn-outline-light" id="closeSummary">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // Center initial quiz type selector
    document.addEventListener('DOMContentLoaded', ()=>{
      document.querySelector('.main-layout')?.classList.add('center-mode');
      document.querySelector('.quiz-type-selector')?.classList.add('center');
    });
    
    // Quiz data will be loaded based on user selection
    let quizData = {};
    let questions = [];
    let quizStates = {};
    let state = { current:0, answers:[], checked:[], score:0 };
    let selectedQuizType = null;
    
    let currentPage = 0;
    const questionsPerPage = 54;

    const $ = id => document.getElementById(id);
    const escapeHtml = (str='') => str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');

    const quizDataEconomia = {
      "title": "Preguntas Economía Parcial 2",
      "questions": [
        {
          "id": 1,
          "type": "single",
          "question": "En economía, a través de la intervención estatal:",
          "options": [

            {"id": "b", "text": "Se regulan procedimientos, productos y mercados", "correct": true},
            {"id": "c", "text": "Establece el funcionamiento de la Administración Pública", "correct": false},
            {"id": "d", "text": "Los precios máximos benefician a los productores", "correct": false}
          ]
        },
        {
          "id": 2,
          "type": "single",
          "question": "En caso de déficit de la Balanza de Pagos, puede:",
          "options": [
            {"id": "a", "text": "Adquirir bienes de capital para equilibrarla", "correct": false},
            {"id": "b", "text": "Solicitar financiamiento a Bancos u Organismos Internacionales", "correct": true},
            {"id": "c", "text": "Prestar dinero a otros países", "correct": false},
            {"id": "d", "text": "Incrementar sus reservas", "correct": false}
          ]
        },
        {
          "id": 3,
          "type": "single",
          "question": "Son indicadores de calidad de vida:",
          "options": [
            {"id": "a", "text": "Indice de Desarrollo Humano y Huella Hídrica", "correct": true},
            {"id": "b", "text": "Tipo de cambio y Curva de Lorenz", "correct": false},
            {"id": "c", "text": "PBI y tipo de cambio", "correct": false},
            {"id": "d", "text": "Curva de Lorenz y PBI per cápita", "correct": false}
          ]
        },
        {
          "id": 4,
          "type": "truefalse",
          "question": "El Deflactor del Producto Bruto Interno (PBI), es el cociente entre PBI nominal y PBI real, generalmente se expresa como la tasa (%) y refleja las variaciones de precios de bienes consumidos, de capital, del sector privado y del sector público.",
          "options": [
            {"id": "a", "text": "Verdadero", "correct": true},
            {"id": "b", "text": "Falso", "correct": false}
          ]
        },
        {
          "id": 5,
          "type": "truefalse",
          "question": "El tipo de cambio Real se puede definir como la cantidad de moneda nacional ($) necesaria para adquirir una unidad de moneda extranjera o divisa, a valor del comprador o exportador y del vendedor o importador; la diferencia es el margen que representa el costo de la intermediación del agente cambiario.",
          "options": [
            {"id": "a", "text": "Verdadero", "correct": false},
            {"id": "b", "text": "Falso", "correct": true}
          ]
        },

    function initQuiz(){
      $('total').textContent = questions.length;
      $('quizTitleHeader').textContent = quizData.title || 'Índice';
      renderIndex(); 
      renderIndexOverlay();
      // Si el state.current excede, ajustamos
      if(state.current >= questions.length) state.current = Math.max(0, questions.length-1);
      goTo(state.current);
      updateScore();
      setupMobileIndexButtons();
      $('sidebarContent').style.display = 'block';
      $('quizContent').style.display = 'block';
      $('quizTypeSelector').classList.add('hidden');
      document.querySelector('.main-layout').classList.remove('center-mode');
      document.querySelector('.quiz-type-selector').classList.remove('center');
      
      // En mobile, ocultar sidebar completamente después de iniciar
      if(window.innerWidth <= 767){
        document.querySelector('.quiz-sidebar')?.classList.add('quiz-started');
      }
    }

    function selectQuizType(type = 'economia'){
      // Guardar estado actual del formulario anterior
      if(selectedQuizType && selectedQuizType !== type){
        quizStates[selectedQuizType] = {
          current: state.current,
          answers: Array.isArray(state.answers) ? state.answers.slice() : [],
          checked: Array.isArray(state.checked) ? state.checked.slice() : [],
          score: state.score,
          questionsSnapshot: questions.map(q => q.id)
        };
      }

      selectedQuizType = type;

      // Cargar el quiz de Economía
      quizData = quizDataEconomia;

      questions = quizData.questions || [];

      // Restaurar estado si existe para este tipo
      if(quizStates[type]){
        const saved = quizStates[type];
        // Ajustar longitudes: si el conjunto de preguntas cambió, normalizamos
        const answers = Array(questions.length).fill(null);
        const checked = Array(questions.length).fill(false);

        // intentamos mapear respuestas antiguas por índice hasta donde haya coincidencia
        for(let i=0;i<Math.min(saved.answers.length, questions.length); i++){
          answers[i] = saved.answers[i];
        }
        for(let i=0;i<Math.min(saved.checked.length, questions.length); i++){
          checked[i] = !!saved.checked[i];
        }

        state = {
          current: Math.min(saved.current || 0, Math.max(0, questions.length-1)),
          answers: answers,
          checked: checked,
          score: saved.score || 0
        };
        // Recalcular score por seguridad (en caso de cambio de preguntas)
        recomputeScore();
      } else {
        // Estado nuevo para este tipo
        state = { current:0, answers:Array(questions.length).fill(null), checked:Array(questions.length).fill(false), score:0 };
      }

      initQuiz();
    }

    /* render índice principal (desktop) con paginación */
    function renderIndex(){
      const list = $('indexList'); 
      list.innerHTML=''; 
      
      // Calcular número de páginas
      const totalPages = Math.ceil(questions.length / questionsPerPage);
      
      // Mostrar navegación si hay más de una página
      if(totalPages > 1) {
        $('indexNavigation').style.display = 'flex';
        renderPagination('indexPagination', totalPages, currentPage, (page) => {
          currentPage = page;
          renderIndex();
          renderIndexOverlay();
        });
        $('pageInfo').textContent = `Página ${currentPage + 1} de ${totalPages}`;
      } else {
        $('indexNavigation').style.display = 'none';
      }
      
      const frag = document.createDocumentFragment();
      const startIndex = currentPage * questionsPerPage;
      const endIndex = Math.min(startIndex + questionsPerPage, questions.length);
      
      for(let i = startIndex; i < endIndex; i++){
        const q = questions[i];
        const btn = document.createElement('button');
        btn.className='q-index-btn';
        btn.textContent = i+1;
        btn.title = q.question;
        if(state.checked[i]){ 
          const correct = evaluate(i,false); 
          btn.classList.add(correct?'correct':'incorrect'); 
        }
        if(i===state.current) btn.classList.add('active');
        btn.addEventListener('click', ()=>goTo(i));
        frag.appendChild(btn);
      }
      list.appendChild(frag);
      $('progressText').textContent = `${state.checked.filter(Boolean).length} / ${questions.length}`;
    }

    /* render índice para overlay (móvil) - con paginación */
    function renderIndexOverlay(){
      const list = $('indexListOverlay'); 
      list.innerHTML=''; 
      
      // Calcular número de páginas
      const totalPages = Math.ceil(questions.length / questionsPerPage);
      
      // Mostrar navegación si hay más de una página
      if(totalPages > 1) {
        $('indexNavigationOverlay').style.display = 'flex';
        renderPagination('indexPaginationOverlay', totalPages, currentPage, (page) => {
          currentPage = page;
          renderIndex();
          renderIndexOverlay();
        });
        $('pageInfoOverlay').textContent = `Página ${currentPage + 1} de ${totalPages}`;
      } else {
        $('indexNavigationOverlay').style.display = 'none';
      }
      
      const frag = document.createDocumentFragment();
      const startIndex = currentPage * questionsPerPage;
      const endIndex = Math.min(startIndex + questionsPerPage, questions.length);
      
      for(let i = startIndex; i < endIndex; i++){
        const q = questions[i];
        const btn = document.createElement('button');
        btn.className='q-index-btn';
        btn.style.minHeight='44px';
        btn.style.padding='4px';
        btn.textContent = i+1;
        btn.title = q.question;
        if(state.checked[i]){ 
          const correct = evaluate(i,false); 
          btn.classList.add(correct?'correct':'incorrect'); 
        }
        if(i===state.current) btn.classList.add('active');
        btn.addEventListener('click', ()=>{ 
          closeIndexOverlay(); 
          goTo(i); 
        });
        frag.appendChild(btn);
      }
      list.appendChild(frag);
    }

    /* Función para renderizar la paginación */
    function renderPagination(containerId, totalPages, currentPage, onPageChange) {
      const container = $(containerId);
      container.innerHTML = '';

      for(let i = 0; i < totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.textContent = i + 1;
        pageBtn.addEventListener('click', () => onPageChange(i));
        container.appendChild(pageBtn);
      }
    } 

    function renderQuestion(){
      const q = questions[state.current];
      const formattedQuestion = escapeHtml(q.question || '').replace(/\n/g,'<br>');
      $('qTitle').innerHTML = `${state.current+1}. ${formattedQuestion}`;
      
      // Actualizar tipo de pregunta
      let typeText = 'Respuesta única';
      if(q.type === 'multiple') typeText = 'Selección múltiple';
      else if(q.type === 'text') typeText = 'Respuesta de texto';
      else if(q.type === 'image-select') typeText = 'Selección de imagen';
      else if(q.type === 'tf') typeText = 'Verdadero / Falso';
      else if(q.type === 'single') typeText = 'Respuesta única';
      $('qType').textContent = typeText;
      
      const area = $('qArea'); area.innerHTML = '';

      // Limpiar cualquier feedback anterior
      const existingFeedback = area.querySelector('.correct-answer-feedback');
      if(existingFeedback) existingFeedback.remove();

      // Imagen de la pregunta
      if(q.image){
        const img = document.createElement('img');
        img.src = q.image;
        img.className = 'question-image';
        img.alt = 'imagen pregunta';
        img.decoding = 'async';
        img.loading = 'lazy';
        if(selectedQuizType === 'practico' && q.id >= 13 && q.id <= 23){
          img.classList.add('question-image-large');
        }
        area.appendChild(img);
      }

      // Pregunta con input de texto
      if(q.type === 'text'){
        const container = document.createElement('div');
        container.className = 'text-input-container';
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'text-answer-input';
        input.placeholder = 'Escribe tu respuesta aquí...';
        input.id = `textInput_${state.current}`;
        // Deshabilitar autocompletado para evitar que el navegador recuerde respuestas anteriores
        input.autocomplete = 'off';
        input.autocapitalize = 'off';
        input.autocorrect = 'off';
        input.spellcheck = false;
        
        // NO restaurar respuestas anteriores para evitar que se muestren
        // Solo mostrar si la pregunta ya fue respondida y es correcta
        const saved = state.answers[state.current];
        if(saved && state.checked[state.current] && evaluate(state.current, false)) {
          input.value = saved;
        } else {
          input.value = '';
        }
        
        input.addEventListener('input', saveAnswer);
        container.appendChild(input);
        area.appendChild(container);
        if(state.checked[state.current]) showFeedback(state.current);
        updateStateText();
        return;
      }

      // Pregunta con selección de imágenes
      if(q.type === 'image-select'){
        const container = document.createElement('div');
        container.className = 'image-options';
        q.options.forEach(opt=>{
          const wrap = document.createElement('label');
          wrap.className = 'image-option';
          wrap.setAttribute('data-opt', opt.id);
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = 'q' + state.current;
          input.value = opt.id;
          const saved = state.answers[state.current];
          if(saved === opt.id) input.checked = true;
          const img = document.createElement('img');
          img.src = opt.image;
          img.alt = opt.text || 'Opción';
          wrap.appendChild(input);
          wrap.appendChild(img);
          container.appendChild(wrap);
          wrap.addEventListener('click', ()=>{ input.checked = true; saveAnswer(); });
          input.addEventListener('change', saveAnswer);
        });
        area.appendChild(container);
        if(state.checked[state.current]) showFeedback(state.current);
        updateStateText();
        return;
      }

      // Preguntas con opciones normales (single/multiple)
      const opts = document.createElement('div'); opts.className='mt-3 d-grid gap-2';
      const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
      
      shuffledOptions.forEach(opt=>{
        const id = `q${state.current}_${opt.id}`;
        const wrap = document.createElement('label'); wrap.className='option'; wrap.setAttribute('data-opt', opt.id);
        const input = document.createElement('input');
        input.type = q.type === 'multiple' ? 'checkbox' : 'radio';
        input.name = 'q' + state.current; input.value = opt.id; input.id = id;
        const saved = state.answers[state.current];
        if(saved){
          if(Array.isArray(saved) && saved.includes(opt.id)) input.checked = true;
          if(typeof saved === 'string' && saved === opt.id) input.checked = true;
        }
        const span = document.createElement('div'); span.className='label-text'; span.textContent = opt.text;
        wrap.appendChild(input); wrap.appendChild(span); opts.appendChild(wrap);

        wrap.addEventListener('click', ()=>{
          if(q.type === 'multiple') input.checked = !input.checked; else input.checked = true;
          saveAnswer();
        });
        input.addEventListener('change', saveAnswer);
      });

      area.appendChild(opts);
      if(state.checked[state.current]) showFeedback(state.current);
      updateStateText();
    }

    function saveAnswer(){
      const q = questions[state.current];
      
      // Para preguntas de texto
      if(q.type === 'text'){
        const input = document.getElementById(`textInput_${state.current}`);
        state.answers[state.current] = input && input.value.trim() ? input.value.trim() : null;
        return;
      }
      
      // Para preguntas con opciones
      const inputs = Array.from(document.querySelectorAll(`[name=q${state.current}]`));
      if(q.type === 'multiple'){
        const arr = inputs.filter(i=>i.checked).map(i=>i.value);
        state.answers[state.current] = arr.length ? arr : null;
      } else {
        const sel = inputs.find(i=>i.checked);
        state.answers[state.current] = sel ? sel.value : null;
      }
    }

    function evaluate(index, apply=true){
      const q = questions[index];
      const user = state.answers[index];
      let ok = false;
      
      // Para preguntas de texto
      if(q.type === 'text'){
        ok = checkTextAnswer(q, user);
      }
      // Para preguntas con opciones
      else {
        const correct = q.options.filter(o=>o.correct).map(o=>o.id).sort();
        if(q.type === 'multiple'){
          const u = Array.isArray(user)? user.slice().sort():[];
          ok = arraysEqual(u, correct);
        } else { ok = !!user && user === correct[0]; }
      }
      
      if(apply){ state.checked[index] = true; recomputeScore(); }
      return ok;
    }

    function recomputeScore(){
      let s=0;
      for(let i=0;i<questions.length;i++){
        const q=questions[i]; const user=state.answers[i];
        if(q.type === 'text'){
          if(checkTextAnswer(q, user)) s++;
        } else {
          const correct = q.options.filter(o=>o.correct).map(o=>o.id).sort();
          if(q.type==='multiple'){ 
            const u=Array.isArray(user)? user.slice().sort():[]; 
            if(u.length && arraysEqual(u,correct)) s++; 
          } else { 
            if(user && user===correct[0]) s++; 
          }
        }
      }
      state.score=s; updateScore();
    }

    function arraysEqual(a,b){ if(a.length!==b.length) return false; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }

    function parseNumericInput(value){
      if(value == null) return null;
      const str = typeof value === 'string' ? value : String(value);
      const normalized = str.replace(/\s+/g,'').replace(/,/g,'.').replace(/[^0-9.\-]/g,'');
      if(!normalized || normalized === '-' || normalized === '.' || normalized === '-.') return null;
      const parsed = parseFloat(normalized);
      return Number.isFinite(parsed) ? parsed : null;
    }

    function isNumericTextQuestion(q){
      return q && q.type === 'text' && q.numericAnswer !== undefined && q.numericAnswer !== null;
    }

    function checkTextAnswer(q, user){
      if(user == null) return false;
      const userInput = typeof user === 'string' ? user : String(user);
      if(!userInput.trim()) return false;

      if(isNumericTextQuestion(q)){
        const numericUser = parseNumericInput(userInput);
        const expected = Number(q.numericAnswer);
        if(!Number.isFinite(numericUser) || !Number.isFinite(expected)) return false;
        const tolerance = typeof q.tolerance === 'number' ? q.tolerance : 0;
        return Math.abs(numericUser - expected) <= tolerance;
      }

      const correctAnswers = Array.isArray(q.correctAnswer) ? q.correctAnswer : (q.correctAnswer ? [q.correctAnswer] : []);
      return correctAnswers.some(ans => {
        if(typeof ans !== 'string') return false;
        const normalizedUser = userInput.toLowerCase().trim().replace(/\s+/g, ' ');
        const normalizedAns = ans.toLowerCase().trim().replace(/\s+/g, ' ');
        return normalizedUser === normalizedAns;
      });
    }

    function showFeedback(index){
      const q = questions[index]; 
      const container = document.querySelector('#qArea');
      
      // Feedback para input de texto
      if(q.type === 'text'){
        const input = document.getElementById(`textInput_${index}`);
        if(input){
          input.classList.remove('correct-input','incorrect-input');
          const correct = evaluate(index, false);
          input.classList.add(correct ? 'correct-input' : 'incorrect-input');
          input.disabled = true;
          
          // Mostrar la respuesta correcta si el usuario se equivocó
          if(!correct) {
            const answers = Array.isArray(q.correctAnswer) ? q.correctAnswer : (q.correctAnswer ? [q.correctAnswer] : []);
            let feedbackText = answers.join(' o ');
            if(isNumericTextQuestion(q)){
              const expectedValue = Number(q.numericAnswer);
              if(!feedbackText){
                feedbackText = Number.isFinite(expectedValue) ? expectedValue.toString() : '';
              }
              if(typeof q.tolerance === 'number'){
                const unit = q.toleranceUnit ? ` ${q.toleranceUnit}` : '';
                feedbackText += ` (tolerancia ±${q.tolerance}${unit})`;
              }
            }
            if(!feedbackText) feedbackText = 'Revisar material de estudio';
            const feedback = document.createElement('div');
            feedback.className = 'correct-answer-feedback';
            feedback.innerHTML = `<strong>Respuesta correcta:</strong> ${feedbackText}`;
            container.appendChild(feedback);
          }
        }
        renderIndex(); renderIndexOverlay();
        return;
      }
      
      // Feedback para selección de imágenes
      if(q.type === 'image-select'){
        const imageEls = container.querySelectorAll('.image-option');
        imageEls.forEach(el=> el.classList.remove('correct','incorrect','selected'));
        const correctId = q.options.find(o=>o.correct)?.id;
        const user = state.answers[index];
        imageEls.forEach(el=>{
          const id = el.getAttribute('data-opt');
          if(id === correctId) el.classList.add('correct');
          if(id === user && id !== correctId) el.classList.add('incorrect');
          if(id === user) el.classList.add('selected');
          const input = el.querySelector('input');
          if(input) input.disabled = true;
        });
        renderIndex(); renderIndexOverlay();
        return;
      }
      
      // Feedback para opciones normales
      const optionEls = container.querySelectorAll('.option');
      optionEls.forEach(el=> el.classList.remove('correct','incorrect'));
      const correctIds = q.options.filter(o=>o.correct).map(o=>o.id);
      optionEls.forEach(el=>{ const id = el.getAttribute('data-opt'); if(correctIds.includes(id)) el.classList.add('correct'); });
      const user = state.answers[index];
      if(Array.isArray(user)){ user.forEach(uid=>{ if(!correctIds.includes(uid)){ const el = container.querySelector(`.option[data-opt='${uid}']`); if(el) el.classList.add('incorrect'); } }); }
      else if(typeof user==='string'){ if(!correctIds.includes(user)){ const el = container.querySelector(`.option[data-opt='${user}']`); if(el) el.classList.add('incorrect'); } }
      renderIndex(); renderIndexOverlay();
    }

    function goTo(i){ 
      if(i<0) i=0; 
      if(i>=questions.length) i=questions.length-1; 
      state.current=i; 
      
      // Actualizar la página actual si es necesario
      const newPage = Math.floor(i / questionsPerPage);
      if(newPage !== currentPage) {
        currentPage = newPage;
        renderIndex();
        renderIndexOverlay();
      } else {
        renderIndex(); 
      }
      
      renderQuestion(); 
    }

    document.getElementById('prevBtn').addEventListener('click', ()=>goTo(state.current-1));
    document.getElementById('nextBtn').addEventListener('click', ()=>goTo(state.current+1));
    document.getElementById('checkBtn').addEventListener('click', ()=>checkCurrent());
    
    // Botones del sidebar (desktop)
    document.getElementById('prevBtnSidebar').addEventListener('click', ()=>goTo(state.current-1));
    document.getElementById('nextBtnSidebar').addEventListener('click', ()=>goTo(state.current+1));
    document.getElementById('checkBtnSidebar').addEventListener('click', ()=>checkCurrent());
    
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') checkCurrent(); });

    function checkCurrent(){
      saveAnswer();
      const user = state.answers[state.current];
      if(!user || (Array.isArray(user)&& user.length===0)){ flash('Selecciona una opción antes de comprobar', 'warning'); return; }
      const ok = evaluate(state.current, true);
      showFeedback(state.current);
      flash(ok? '¡Correcto!' : 'Incorrecto', ok? 'success' : 'error');
    }

    function flash(text, type='info'){
      const d=document.createElement('div'); 
      d.textContent=text; 
      d.style.position='fixed'; 
      d.style.left='50%'; 
      d.style.transform='translateX(-50%)'; 
      d.style.bottom='18px'; 
      d.style.padding='10px 16px'; 
      d.style.borderRadius='10px'; 
      d.style.zIndex=9999; 
      d.style.fontWeight=600;
      d.style.fontSize='0.92rem';
      d.style.boxShadow='0 8px 20px rgba(15,23,42,0.16)';
      
      if(type === 'success'){
        d.style.background='#2d8a57';
        d.style.border='1px solid #2d8a57';
        d.style.color='#ffffff';
      } else if(type === 'error'){
        d.style.background='#b6464f';
        d.style.border='1px solid #b6464f';
        d.style.color='#ffffff';
      } else if(type === 'warning'){
        d.style.background='#a87818';
        d.style.border='1px solid #a87818';
        d.style.color='#ffffff';
      } else {
        d.style.background='#25314f'; 
        d.style.border='1px solid #25314f';
        d.style.color='#ffffff';
      }
      
      document.body.appendChild(d);
      setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity=0; },1200); 
      setTimeout(()=>d.remove(),1800);
    }

    function updateScore(){ $('score').textContent=state.score; $('total').textContent=questions.length; $('progressText').textContent = `${state.checked.filter(Boolean).length} / ${questions.length}`; updateStateText(); }

    function updateStateText(){ $('qState').textContent = state.checked[state.current] ? (evaluate(state.current,false)? 'Respondida - correcta':'Respondida - incorrecta') : 'Sin responder'; }

    /* ---- Mobile index overlay controls ---- */
    function setupMobileIndexButtons(){
      const openBtn = $('openIndexBtn'), closeBtn = $('closeIndexBtn'), overlay = $('indexOverlay');
      if(!openBtn) return;
      openBtn.addEventListener('click', openIndexOverlay);
      closeBtn.addEventListener('click', closeIndexOverlay);
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeIndexOverlay(); });
      document.addEventListener('keydown', (e)=>{ 
        if(e.key === 'Escape') {
          closeIndexOverlay(); 
          closeSummary();
        }
      });
    }
    function openIndexOverlay(){ 
      const o=$('indexOverlay'); 
      o.classList.add('open'); 
      o.setAttribute('aria-hidden','false'); 
      $('openIndexBtn').setAttribute('aria-expanded','true'); 
      
      // Asegurarse de que la página actual se muestre correctamente
      const questionPage = Math.floor(state.current / questionsPerPage);
      if(questionPage !== currentPage) {
        currentPage = questionPage;
        renderIndex();
        renderIndexOverlay();
      }
    }
    function closeIndexOverlay(){ const o=$('indexOverlay'); o.classList.remove('open'); o.setAttribute('aria-hidden','true'); $('openIndexBtn').setAttribute('aria-expanded','false'); }

    /* ---- Summary Modal ---- */
    function showSummary(){
      const answered = state.checked.filter(Boolean).length;
      let correct = 0, incorrect = 0;
      
      for(let i=0; i<questions.length; i++){
        if(state.checked[i]){
          if(evaluate(i, false)) correct++;
          else incorrect++;
        }
      }
      
      const unanswered = questions.length - answered;
      const percentage = questions.length > 0 ? Math.round((correct / questions.length) * 100) : 0;
      
      $('statCorrect').textContent = correct;
      $('statIncorrect').textContent = incorrect;
      $('statUnanswered').textContent = unanswered;
      $('statTotal').textContent = questions.length;
      
      const scoreEl = $('summaryScore');
      scoreEl.textContent = percentage + '%';
      scoreEl.className = 'summary-score';
      if(percentage >= 90) scoreEl.classList.add('excellent');
      else if(percentage >= 70) scoreEl.classList.add('good');
      else if(percentage >= 50) scoreEl.classList.add('fair');
      else scoreEl.classList.add('poor');
      
      $('summaryModal').classList.add('show');
    }

    function closeSummary(){
      $('summaryModal').classList.remove('show');
    }

    function restartQuiz(){
      state.answers = Array(questions.length).fill(null);
      state.checked = Array(questions.length).fill(false);
      state.score = 0;
      state.current = 0;
      currentPage = 0; // Reiniciar a la primera página
      closeSummary();
      renderIndex();
      renderIndexOverlay();
      renderQuestion();
      updateScore();
    }

    function reviewIncorrect(){
      closeSummary();
      for(let i=0; i<questions.length; i++){
        if(state.checked[i] && !evaluate(i, false)){
          goTo(i);
          return;
        }
      }
      flash('No hay preguntas incorrectas para repasar');
    }

    $('showSummaryBtn').addEventListener('click', showSummary);
    $('mobileSummaryBtn').addEventListener('click', showSummary);
    $('closeSummary').addEventListener('click', closeSummary);
    $('restartQuiz').addEventListener('click', restartQuiz);
    $('reviewIncorrect').addEventListener('click', reviewIncorrect);
    $('summaryModal').addEventListener('click', (e)=>{ if(e.target === $('summaryModal')) closeSummary(); });

    $('btnEconomia').addEventListener('click', function(){
      if(selectedQuizType === 'economia') return;
      updateQuizTypeSelection('economia');
      selectQuizType('economia');
    });

    function updateQuizTypeSelection(type){
      const btn = $('btnEconomia');
      if(btn){
        btn.classList.toggle('selected', type === 'economia');
      }
    }
  </script>
</body>
</html>
